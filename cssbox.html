<!--
   Content - Actual text or image inside the element.
   Padding- Space between content and border.
   Border - Boundary Surrounding the element.
   Margin - Space outside the border. -->
<html>
<head>
    <title>CSS Box Model</title>
    <style>

        .box {
            width: 250px;
            padding: 20px;
            border: 5px solid blue;
            margin: 30px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h1>CSS Box Model</h1>
    <div class="box">
        <h2>ABC College</h2>
        <p>Welcome to our college website.</p>
    </div>
</body>
</html>
