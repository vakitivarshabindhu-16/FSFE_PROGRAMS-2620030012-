<html>
    <head>
        <title>
            Registration PAGE
        </title>
    </head>
    <body align="center">
        <h1> REGISTRATION PAGE </h1>
        <form action="success.html" method="get">        
            Name : <input type="text" name="g1" placeholder="Enter your Name"
            autofocus><br><br>
            Email : <input type="email" name="g2" placeholder="abc@klh.edu.in" 
            required><br><br>
            Mobile : <input type="tel" name="g3" placeholder="Enter you Number" pattern="[0-9]{10}"required>
            <br><br>


            Course : <select name="g4" required>
                <option value="1">SELECT COURSE</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
                <option>P.hD</option>
            </select><br><br>

            Gender : <input type="radio" name="g5" required>Male
            <input type="radio" name="g5" required>Female<br><br>

            Address : <textarea name="g6" required rows="3" cols="30" placeholder="rrb">



            </textarea><br><br>

            Skills known : <input type="checkbox" name="g7">HTML<BR>
            <input type="checkbox" name="g7">CSS<BR>
            <input type="checkbox" name="g7">Java Script<BR>
            <input type="checkbox" name="g7">PHP<BR><br>

          Inter Percentage : <input type="number" name="g8"  min="0" max="100" required><br><br>

            Upload Photo : <input type="file" name="g9" accept=".jpg,.jpeg,.png" ><br><br>

            Password : <input type="password" name="g10" minlength="6" required><br><br>

            <input type="checkbox" name="g11" required> I agree to the terms<br><br>

            <button type="submit"> Register </button>
            <button type="reset"> Clear All </button>


        </form>
    </body>
    </html>
